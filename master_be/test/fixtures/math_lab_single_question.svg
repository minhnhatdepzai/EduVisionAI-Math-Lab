  <text x="120" y="170" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" fill="#111">BÀI TOÁN LỚP 4</text>
  <text x="120" y="285" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#111">Một khu vườn hình chữ nhật có chiều dài 12 m</text>
  <text x="120" y="350" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#111">và chiều rộng 7 m. Tính chu vi khu vườn đó.</text>
